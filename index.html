<title>Ingliz tili mashqlari</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- IBM Plex dagi «ʻ» juda keng (so ʻ z boʻlib koʻrinadi) — faqat shu belgi Noto Sans dan olinadi, u --body da birinchi turadi -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&text=%CA%BB%CA%BC&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
/* kurs ranglari: har bir kurs kartasi oʻz rangida */
:root{
  --c-verbs:#1f5f58; --c-verbs-s:#d6e8e3;
  --c-a1:#8a5a12; --c-a1-s:#f3e4c8;
  --c-a2:#2b5a8a; --c-a2-s:#dbe6f2;
  --c-lis:#6b4a8f; --c-lis-s:#e7def1;
  --c-spk:#9c3d5a; --c-spk-s:#f4dce4;
  --c-my:#2f6b3a; --c-my-s:#dcebdc;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --c-verbs:#7fc9bb; --c-verbs-s:#1f3330;
  --c-a1:#e2b25e; --c-a1-s:#3a2f1c;
  --c-a2:#8fb8e8; --c-a2-s:#1f2b3a;
  --c-lis:#c2a3e6; --c-lis-s:#2c2438;
  --c-spk:#ef9ab4; --c-spk-s:#3a2229;
  --c-my:#8ed49a; --c-my-s:#1f2e22;
}}
:root[data-theme="dark"]{
  --c-verbs:#7fc9bb; --c-verbs-s:#1f3330;
  --c-a1:#e2b25e; --c-a1-s:#3a2f1c;
  --c-a2:#8fb8e8; --c-a2-s:#1f2b3a;
  --c-lis:#c2a3e6; --c-lis-s:#2c2438;
  --c-spk:#ef9ab4; --c-spk-s:#3a2229;
  --c-my:#8ed49a; --c-my-s:#1f2e22;
}
.home{display:flex;flex-direction:column;gap:18px;padding-top:22px}
/* salom va bugungi maqsad */
.hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero .hi{flex:1 1 170px;min-width:0}
.hero h2{margin:0;font-size:clamp(1.5rem,5vw,2rem)}
.hero .date{font-size:.86rem;color:var(--muted);margin:2px 0 0}
.hero .motto{font-size:.95rem;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.pill.fire{color:var(--gold);border-color:var(--gold)}
.goal{flex:0 0 auto;display:flex;align-items:center;gap:14px;appearance:none;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.goal:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px}
.ring{width:96px;height:96px;flex:0 0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease-out}
.ring.done .fg{stroke:var(--ok)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.ring b small{font-family:var(--body);font-size:.7rem;font-weight:500;color:var(--muted);margin-top:3px}
.goal .gl{font-size:.8rem;color:var(--muted);max-width:130px}
.goal .gl b{display:block;color:var(--fg);font-size:.92rem}
/* qidiruv */
.searchbox{position:relative;display:block;margin:0}
.searchbox input[type=search]{width:100%;font:inherit;font-size:1.05rem;background:var(--surface);color:var(--fg);border:1px solid var(--line);
  border-radius:12px;padding:14px 16px 14px 46px;-webkit-appearance:none;appearance:none}
.searchbox input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.searchbox svg{position:absolute;left:16px;top:50%;width:19px;height:19px;transform:translateY(-50%);color:var(--muted);
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;pointer-events:none}
/* bugungi ikki asosiy ish */
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.act{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);text-decoration:none;color:var(--fg);
  background:var(--surface);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.act:hover{border-color:var(--accent);transform:translateY(-1px)}
.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.act.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.act.main .t small{color:inherit;opacity:.85}
.act.main .ic{background:rgba(255,255,255,.18);color:inherit}
.act .ic{width:46px;height:46px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.act .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act .t{flex:1 1 auto;min-width:0}
.act .t b{display:block;font-size:1.02rem;line-height:1.3}
.act .t small{display:block;font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .go{font-size:1.4rem;opacity:.7}
.act.ok{border-color:var(--ok)}
.act.ok .ic{background:var(--ok-soft);color:var(--ok)}
/* kurslar */
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 0 -6px}
.sech h3{font-family:var(--display);font-size:1.15rem;margin:0}
.sech a{font-size:.86rem;color:var(--accent);text-decoration:none;font-weight:600}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.course{--c:var(--accent);--cs:var(--accent-soft);position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);transition:transform .15s,box-shadow .15s}
.course:hover{transform:translateY(-2px);box-shadow:0 6px 18px -10px rgba(0,0,0,.35)}
.course .hd{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.course .hd::after{content:"";position:absolute;inset:0;border-radius:inherit}
.course .hd:focus-visible{outline:none}
.course:has(.hd:focus-visible){outline:2px solid var(--c);outline-offset:2px}
.course .ic{width:42px;height:42px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--cs);color:var(--c)}
.course .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.course .nm{min-width:0}
.course .nm b{display:block;font-size:1.02rem;line-height:1.25}
.course .nm small{display:block;font-size:.8rem;color:var(--muted)}
.course .pg{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.course .trk{flex:1 1 auto;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.course .trk i{display:block;height:100%;background:var(--c);border-radius:inherit;transition:width .6s ease-out}
.course .bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;position:relative;z-index:1}
.course .bt a{font-size:.84rem;font-weight:600;text-decoration:none;padding:7px 13px;border-radius:8px;border:1px solid var(--line);color:var(--fg);background:var(--surface)}
.course .bt a.pri{background:var(--c);border-color:var(--c);color:var(--surface)}
.course .bt a.bad{color:var(--bad);border-color:var(--bad)}
.course .bt a:hover{filter:brightness(1.08)}
.course .bt a:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.course.k-verbs{--c:var(--c-verbs);--cs:var(--c-verbs-s)}
.course.k-a1{--c:var(--c-a1);--cs:var(--c-a1-s)}
.course.k-a2{--c:var(--c-a2);--cs:var(--c-a2-s)}
.course.k-lis{--c:var(--c-lis);--cs:var(--c-lis-s)}
.course.k-spk{--c:var(--c-spk);--cs:var(--c-spk-s)}
.course.k-my{--c:var(--c-my);--cs:var(--c-my-s)}
.course.k-game{--c:var(--gold);--cs:var(--c-a1-s)}
@media (prefers-reduced-motion: reduce){.course,.act{transition:none}.course:hover,.act:hover{transform:none}}
@media (max-width:560px){
  .hero{gap:14px}
  .ring{width:84px;height:84px}
  .goal .gl{display:none}
}
</style>

<header class="top" data-section="home">
  <div class="top-in">
    <div class="brand">
      <svg class="mark" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
        <rect width="256" height="256" rx="56" fill="var(--accent)"/>
        <g fill="none" stroke="var(--surface)" stroke-width="11" stroke-linecap="round">
          <path d="M62 156 A33 64 0 0 1 128 156"/>
          <path d="M128 156 A33 38 0 0 1 194 156"/>
        </g>
        <circle cx="62" cy="156" r="14" fill="var(--surface)"/>
        <circle cx="128" cy="156" r="14" fill="var(--surface)"/>
        <circle cx="194" cy="156" r="14" fill="var(--gold)"/>
      </svg>
      <h1>Ingliz tili</h1>
      <span class="sub" id="brandStat"></span>
      <nav class="switch" id="secNav" aria-label="Asosiy menyu"></nav>
    </div>
    <div style="height:12px"></div>
  </div>
</header>
<script src="ui.js"></script>

<div class="wrap">
<main class="home">

  <section class="card hero" style="padding-block:20px" aria-label="Bugun">
    <div class="hi">
      <h2 id="hello">Salom!</h2>
      <p class="date" id="today"></p>
      <p class="motto" id="motto"></p>
      <div class="chips" id="chips"></div>
    </div>
    <button class="goal" type="button" id="goalBtn" title="Kunlik maqsadni oʻzgartirish">
      <span class="ring" id="ring">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" id="ringFg" cx="50" cy="50" r="42"/></svg>
        <b id="ringN">0<small>/ 30</small></b>
      </span>
      <span class="gl"><b>Bugungi maqsad</b><span id="goalTxt">30 ta javob</span> · bosib oʻzgartiring</span>
    </button>
  </section>

  <form class="searchbox" action="my.html" method="get" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input type="search" name="q" placeholder="Soʻz qidirish: inglizcha yoki oʻzbekcha" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="Soʻz qidirish">
  </form>

  <div class="duo" id="duo"></div>

  <div class="sech"><h3>Kurslar</h3><a href="stats.html">Barcha natijalar →</a></div>
  <div class="courses" id="courses"></div>

</main>
</div>

<script>
(function () {
var MAXLVL = 5;
/* Bosh sahifadagi kurslar. kind: "words" — level boʻyicha soʻzlar, "lesson" — darslar, "my" — oʻz lugʻatim */
var COURSES = [
  { id: "verbs", cls: "k-verbs", key: "irrverbs.v1", title: "Irregular verbs", sub: "100 ta notoʻgʻri feʻl", icon: "verbs", href: "verbs.html", n: 100, kind: "words", unit: "feʻl" },
  { id: "a1", cls: "k-a1", key: "a1words.v1", title: "A1 soʻzlar", sub: "24 unit, 1372 ta soʻz", icon: "book", href: "words.html", n: 1372, kind: "words", unit: "soʻz" },
  { id: "a2", cls: "k-a2", key: "a2words.v1", title: "A2 soʻzlar", sub: "24 unit, 1028 ta soʻz", icon: "books", href: "a2.html", n: 1028, kind: "words", unit: "soʻz" },
  { id: "lis", cls: "k-lis", key: "a2listening.v1", title: "A2 Listening", sub: "Tinglab tushunish", icon: "listening", href: "a2-listening.html", n: 48, kind: "lesson" },
  { id: "spk", cls: "k-spk", key: "a2speaking.v1", title: "A2 Speaking", sub: "24 mavzu, 96 savol", icon: "speaking", href: "a2-speaking.html", n: 24, kind: "lesson" },
  { id: "games", cls: "k-game", key: "games.v1", title: "Oʻyinlar", sub: "Oʻynab oʻrganamiz", icon: "game", href: "games.html", kind: "game" },
  { id: "my", cls: "k-my", key: "my.v1", title: "Mening soʻzlarim", sub: "Oʻzim qoʻshgan soʻzlar", icon: "mine", href: "my.html#lugat", kind: "my" }
];
var GOALS = [20, 30, 50, 100];
var MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];
var WDAYS = ["yakshanba", "dushanba", "seshanba", "chorshanba", "payshanba", "juma", "shanba"];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function p2(n) { return (n < 10 ? "0" : "") + n; }
function keyOf(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function daysAgo(i) { var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - i); return d; }
function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function read(key) {
  try { var o = JSON.parse(localStorage.getItem(key) || "null"); if (o && typeof o === "object") return o; } catch (e) {}
  return null;
}
function goal() { var g = 30; try { g = parseInt(localStorage.getItem("app.goal"), 10); } catch (e) {} return GOALS.indexOf(g) > -1 ? g : 30; }

/* kurs holati: sahifaning oʻzi yozgan tayyor hisob (sum) dan */
function courseState(C, st) {
  var s = st && st.sum;
  if (C.kind === "lesson") {
    var n = (s && s.n) || C.n, done = (s && s.done) || 0;
    return { pct: n ? done / n * 100 : 0, line: done + " / " + n + " dars", mis: 0, started: !!(s && (s.done || s.ok || s.bad)) };
  }
  if (C.kind === "game") {
    /* daraja: games.html dagidek — n-darajaga 50·(n−1)·n XP kerak */
    var xp = (st && st.xp) || 0, lv = 1;
    while (xp >= 50 * lv * (lv + 1)) lv++;
    var a = 50 * (lv - 1) * lv, b = 50 * lv * (lv + 1);
    return { pct: (xp - a) / (b - a) * 100, line: xp ? "⭐ " + lv + "-daraja · " + xp + " XP" : "4 ta oʻyin: tez javob, juftlar, harflar, soʻzni top", mis: 0, started: xp > 0, noPct: true };
  }
  if (C.kind === "my") {
    var w =(st && st.w) ? st.w.length : 0, lv = (s && s.lv) || [0, 0, 0, 0, 0, 0];
    return { pct: w ? lv[MAXLVL] / w * 100 : 0, line: w ? w + " ta soʻz · " + lv[MAXLVL] + " ta yodlangan" : "Hali soʻz yoʻq", mis: 0, started: w > 0, words: w };
  }
  var N = (s && s.n) || C.n, L = (s && s.lv) || null, sumL = 0;
  if (L) L.forEach(function (c, l) { sumL += c * l; });
  var learned = L ? L[MAXLVL] : 0;
  return { pct: L ? sumL / (N * MAXLVL) * 100 : 0, line: num(learned) + " / " + num(N) + " yodlangan", mis: (s && s.mis) || 0, started: !!(s && (s.seen || s.ok || s.bad)) };
}

function render() {
  var stores = {};
  COURSES.forEach(function (C) { stores[C.key] = read(C.key); });

  /* bugungi javoblar va ketma-ket kunlar — hamma boʻlimdan (statistika sahifasidagidek) */
  var day = {};
  Object.keys(stores).forEach(function (k) {
    var st = stores[k];
    if (!st || !st.d) return;
    Object.keys(st.d).forEach(function (dk) {
      var e = st.d[dk] || [], t = day[dk] || (day[dk] = [0, 0, 0]);
      t[0] += e[0] | 0; t[1] += e[1] | 0; t[2] += e[2] | 0;
    });
  });
  function at(i) { return day[keyOf(daysAgo(i))] || [0, 0, 0]; }
  function active(e) { return e[0] + e[1] > 0; }
  var streak = 0, i0 = active(at(0)) ? 0 : 1;
  for (var i = i0; i < 3660 && active(at(i)); i++) streak++;
  var td = at(0), n = td[0] + td[1], G = goal(), done = n >= G;

  var now = new Date(), h = now.getHours();
  $("hello").textContent = h >= 5 && h < 11 ? "Xayrli tong! ☀️" : h >= 11 && h < 17 ? "Xayrli kun!" : h >= 17 && h < 23 ? "Xayrli kech!" : "Xayrli tun! 🌙";
  $("today").textContent = now.getDate() + "-" + MONTHS[now.getMonth()] + ", " + WDAYS[now.getDay()];
  $("motto").textContent = !n ? (streak ? "Bugun ham ozgina mashq qiling — " + streak + " kunlik zanjir uzilmasin." : "Bugun hali mashq qilinmadi. 5 daqiqa ham yetadi!")
    : done ? "Bugungi maqsad bajarildi — barakalla! 🎉 Xohlasangiz, yana davom eting."
    : "Maqsadgacha " + (G - n) + " ta javob qoldi. Davom eting!";
  var chips = "";
  if (streak) chips += '<span class="pill fire">🔥 ' + streak + " kun ketma-ket</span>";
  if (n) chips += '<span class="pill">✓ ' + td[0] + " toʻgʻri · " + td[1] + " xato</span>";
  if (td[2]) chips += '<span class="pill">⭐ ' + td[2] + " ta soʻz yodlandi</span>";
  $("chips").innerHTML = chips;
  $("brandStat").textContent = streak ? "🔥 " + streak + " kun" : "";

  var C2 = 2 * Math.PI * 42, fg = $("ringFg");
  fg.style.strokeDasharray = C2;
  fg.style.strokeDashoffset = C2 * (1 - Math.min(1, n / G));
  $("ring").classList.toggle("done", done);
  $("ringN").innerHTML = (done ? "✓" : num(n)) + "<small>" + (done ? num(n) + " javob" : "/ " + G) + "</small>";
  $("goalTxt").textContent = G + " ta javob";
  $("goalBtn").setAttribute("aria-label", "Bugungi maqsad: " + G + " ta javobdan " + n + " tasi bajarildi. Bosing — maqsadni oʻzgartirish");

  /* takrorlash va davom ettirish */
  var my = stores["my.v1"], P = my && my.plan, todayK = keyOf(new Date());
  var rv;
  if (P && P.day === todayK && P.ids && P.ids.length) {
    var left = P.ids.filter(function (id) { return !(P.done && P.done[id]); }).length;
    rv = left ? { cls: "main", t: "Bugungi takrorlash", s: left + " ta soʻz sizni kutyapti" }
      : { cls: "ok", t: "Takrorlash bajarildi ✓", s: "Ertaga yangi soʻzlar tayyor boʻladi" };
  } else {
    var mis = 0;
    ["irrverbs.v1", "a1words.v1", "a2words.v1"].forEach(function (k) { var s = stores[k] && stores[k].sum; mis += (s && s.mis) || 0; });
    var mw = my && my.w ? my.w.length : 0;
    rv = mis + mw ? { cls: "main", t: "Bugungi takrorlash", s: "Xato qilgan va oʻzim qoʻshgan soʻzlar" + (mis + mw ? " (" + (mis + mw) + ")" : "") }
      : { cls: "", t: "Bugungi takrorlash", s: "Xato qilgan soʻzlaringiz shu yerga tushadi" };
  }
  var last = read("app.last"), cont;
  if (last && last.href && /^[a-z0-9-]+\.html$/.test(last.href)) {
    cont = { href: last.href, t: "Davom ettirish", s: last.title || "Oxirgi mashq", icon: iconOf(last.sec, last.skill) };
  } else cont = { href: "verbs.html", t: "Boshlash", s: "Irregular verbs — eng koʻp kerak boʻladigan 100 feʻl", icon: "verbs" };
  $("duo").innerHTML =
    '<a class="act ' + rv.cls + '" href="my.html#bugun"><span class="ic">' + svgIcon("review") + '</span><span class="t"><b>' + esc(rv.t) + "</b><small>" + esc(rv.s) + '</small></span><span class="go" aria-hidden="true">›</span></a>' +
    '<a class="act" href="' + esc(cont.href) + '"><span class="ic">' + svgIcon(cont.icon) + '</span><span class="t"><b>' + esc(cont.t) + "</b><small>" + esc(cont.s) + '</small></span><span class="go" aria-hidden="true">›</span></a>';

  /* kurslar */
  $("courses").innerHTML = COURSES.map(function (C) {
    var s = courseState(C, stores[C.key]), bt = "";
    if (C.kind === "words") {
      bt = '<a class="pri" href="' + C.href + '#mashq">▶ Mashq</a>' + (s.mis ? '<a class="bad" href="' + C.href + '#xatolar">Xatolar · ' + s.mis + "</a>" : "");
    } else if (C.kind === "lesson") {
      bt = '<a class="pri" href="' + C.href + '">' + (s.started ? "▶ Davom ettirish" : "▶ Boshlash") + "</a>";
    } else if (C.kind === "game") {
      bt = '<a class="pri" href="games.html">▶ Oʻynash</a><a href="games.html#speed">⚡ 60 soniya</a>';
    } else {
      bt = '<a class="pri" href="my.html#lugat">+ Soʻz qoʻshish</a>' + (s.words ? '<a href="my.html#bugun">Takrorlash</a>' : "");
    }
    return '<div class="course ' + C.cls + '">' +
      '<a class="hd" href="' + C.href + '"><span class="ic">' + svgIcon(C.icon) + '</span><span class="nm"><b>' + esc(C.title) + "</b><small>" + esc(C.sub) + "</small></span></a>" +
      '<div class="pg"><span class="trk"><i style="width:' + Math.max(0, Math.min(100, s.pct)).toFixed(1) + '%"></i></span><span>' + (s.noPct ? "XP" : Math.round(s.pct) + "%") + "</span></div>" +
      '<div class="pg" style="margin-top:-6px">' + esc(s.line) + "</div>" +
      '<div class="bt">' + bt + "</div></div>";
  }).join("");
}
function iconOf(sec, skill) {
  if (sec === "verbs") return "verbs";
  if (skill === "listening") return "listening";
  if (skill === "speaking") return "speaking";
  return sec === "a2" ? "books" : "book";
}

$("goalBtn").addEventListener("click", function () {
  var g = GOALS[(GOALS.indexOf(goal()) + 1) % GOALS.length];
  try { localStorage.setItem("app.goal", String(g)); } catch (e) {}
  render();
});

window.addEventListener("pageshow", render);
document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });
