<title>Oʻyinlar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- IBM Plex dagi «ʻ» juda keng (so ʻ z boʻlib koʻrinadi) — faqat shu belgi Noto Sans dan olinadi, u --body da birinchi turadi -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&text=%CA%BB%CA%BC&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
:root{
  --g1:#b4581c; --g1s:#f7e2d2;   /* 60 soniya */
  --g2:#2b5a8a; --g2s:#dbe6f2;   /* juftlar */
  --g3:#6b4a8f; --g3s:#e7def1;   /* harflar */
  --g4:#9c3d5a; --g4s:#f4dce4;   /* soʻzni top */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --g1:#f0a36d; --g1s:#3a281c; --g2:#8fb8e8; --g2s:#1f2b3a; --g3:#c2a3e6; --g3s:#2c2438; --g4:#ef9ab4; --g4s:#3a2229;
}}
:root[data-theme="dark"]{
  --g1:#f0a36d; --g1s:#3a281c; --g2:#8fb8e8; --g2s:#1f2b3a; --g3:#c2a3e6; --g3s:#2c2438; --g4:#ef9ab4; --g4s:#3a2229;
}
/* daraja */
.g-lvl{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.g-badge{width:64px;height:64px;border-radius:18px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--gold);color:var(--surface);font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1}
.g-badge small{font-family:var(--body);font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.g-lvl .t{flex:1 1 200px;min-width:0}
.g-lvl .t b{display:block;font-size:1.1rem}
.g-lvl .t span{font-size:.84rem;color:var(--muted)}
.g-xp{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.g-xp i{display:block;height:100%;background:var(--gold);border-radius:inherit;transition:width .6s ease-out}
.g-tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.g-tog{appearance:none;font:inherit;font-size:.84rem;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
.g-tog[aria-pressed="false"]{opacity:.55}
.g-tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* soʻz manbasi */
.g-src{display:flex;flex-wrap:wrap;gap:8px}
.g-src small{font-weight:400;color:var(--muted);margin-left:4px}
/* oʻyin kartalari */
.g-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.g-card{--c:var(--g1);--cs:var(--g1s);appearance:none;font:inherit;color:var(--fg);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-bottom:4px solid var(--c);transition:transform .15s,box-shadow .15s}
.g-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px -12px rgba(0,0,0,.4)}
.g-card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.g-card:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.g-card .em{width:54px;height:54px;border-radius:14px;background:var(--cs);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:6px}
/* telefonda karta ixcham: belgi chapda, matn oʻngda */
@media (max-width:560px){
  .g-card{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:2px;padding:14px;align-items:start}
  .g-card .em{grid-row:1 / span 3;margin:0;width:50px;height:50px}
  .g-card b{font-size:1.1rem}
  .g-card span:not(.em){font-size:.82rem}
  .g-card .rec{padding-top:4px}
}
.g-card b{font-family:var(--display);font-size:1.2rem}
.g-card span{font-size:.86rem;color:var(--muted)}
.g-card .rec{margin-top:auto;padding-top:8px;font-size:.8rem;font-weight:600;color:var(--c)}
.g-card.g1{--c:var(--g1);--cs:var(--g1s)} .g-card.g2{--c:var(--g2);--cs:var(--g2s)}
.g-card.g3{--c:var(--g3);--cs:var(--g3s)} .g-card.g4{--c:var(--g4);--cs:var(--g4s)}
/* oʻyin maydoni */
.g-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.g-top h2{margin:0;font-size:1.2rem;flex:1 1 auto}
.g-num{font-family:var(--display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.g-num small{font-family:var(--body);font-size:.72rem;font-weight:500;color:var(--muted);margin-left:3px}
.g-x{appearance:none;font:inherit;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem}
.g-meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:16px}
.g-meter i{display:block;height:100%;background:var(--g1);border-radius:inherit;transition:width .1s linear}
.g-meter.low i{background:var(--bad)}
.g-stage{min-height:300px}
.g-prompt{text-align:center;padding:14px 0 18px}
.g-prompt .k{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.g-prompt .w{font-family:var(--display);font-size:clamp(1.8rem,7vw,2.8rem);font-weight:700;line-height:1.15;margin:4px 0 0;overflow-wrap:anywhere}
.g-prompt .w.uz{font-style:italic;font-weight:400;font-size:clamp(1.4rem,6vw,2rem)}
.g-combo{display:inline-block;margin-top:8px;font-size:.84rem;font-weight:700;color:var(--g1);min-height:1.3em}
/* 60 soniya: variantlar */
.g-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g-opt{appearance:none;font:inherit;font-size:1rem;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px 12px;min-height:64px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;overflow-wrap:anywhere;transition:transform .08s}
.g-opt:active{transform:scale(.97)}
.g-opt kbd{font-family:var(--mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex:0 0 auto}
.g-opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.g-opt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
@media (pointer:coarse){.g-opt kbd{display:none}}
@media (max-width:420px){.g-opts{grid-template-columns:1fr}}
/* juftlar */
.g-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;perspective:800px}
@media (max-width:560px){.g-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.g-tile{appearance:none;font:inherit;border:0;padding:0;background:none;cursor:pointer;aspect-ratio:4/3;position:relative;transform-style:preserve-3d;transition:transform .35s}
.g-tile.open,.g-tile.done{transform:rotateY(180deg)}
.g-tile .f,.g-tile .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center}
.g-tile .f{background:var(--g2);color:var(--surface);font-size:1.6rem;font-family:var(--display);font-weight:700}
.g-tile .b{transform:rotateY(180deg);background:var(--surface);border:2px solid var(--g2);color:var(--fg);font-size:.95rem;font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.g-tile .b.en{font-family:var(--mono)}
.g-tile .b.uz{font-style:italic;font-weight:500}
.g-tile.done .b{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.g-tile.miss .b{border-color:var(--bad);background:var(--bad-soft)}
.g-tile:focus-visible{outline:2px solid var(--g2);outline-offset:3px;border-radius:12px}
/* harflar va soʻzni top */
.g-slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 18px}
.g-slot{appearance:none;font:inherit;width:42px;height:50px;border-radius:10px;border:2px dashed var(--line);background:var(--surface-2);
  font-family:var(--mono);font-size:1.4rem;font-weight:600;color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;text-transform:uppercase}
.g-slot.full{border-style:solid;border-color:var(--g3);background:var(--surface)}
.g-slot.hint{border-color:var(--gold);color:var(--gold)}
.g-slots.ok .g-slot{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.g-slots.no{animation:shake .3s}
.g-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.g-letter{appearance:none;font:inherit;width:48px;height:52px;border-radius:12px;border:0;background:var(--g3);color:var(--surface);
  font-family:var(--mono);font-size:1.4rem;font-weight:700;cursor:pointer;text-transform:uppercase;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s}
.g-letter:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.g-letter.used{visibility:hidden}
.g-acts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}
@media (max-width:420px){.g-slot{width:34px;height:44px;font-size:1.15rem}.g-letter{width:42px;height:48px}}
.g-hearts{font-size:1.25rem;letter-spacing:2px;text-align:center;min-height:1.6em}
.g-hearts .lost{filter:grayscale(1);opacity:.3}
.g-kb{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:8px}
.g-kb div{display:flex;gap:5px;justify-content:center;width:100%}
.g-key{appearance:none;font:inherit;flex:0 1 38px;height:46px;min-width:0;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);
  font-family:var(--mono);font-weight:600;font-size:1rem;cursor:pointer;text-transform:uppercase}
.g-key.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.g-key.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);opacity:.6}
.g-key:disabled{cursor:default}
.g-reveal{text-align:center;font-size:.95rem;min-height:1.5em;margin:0}
.g-reveal b{font-family:var(--mono)}
/* natija */
.g-end{text-align:center}
.g-end .big{font-family:var(--display);font-size:3.2rem;font-weight:700;line-height:1;margin:6px 0 0}
.g-end .stars{font-size:2rem;letter-spacing:4px;margin-top:6px}
.g-end .new{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;background:var(--gold);color:var(--surface);font-weight:700;font-size:.86rem}
.g-end .line{color:var(--muted);margin:10px 0 0}
.g-miss{list-style:none;margin:16px 0 0;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.g-miss li{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:.92rem}
.g-miss li span{flex:1 1 auto;min-width:0}
.g-miss li b{font-family:var(--mono)}
.g-end .startbar{justify-content:center}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.bump{animation:bump .3s ease-out}
@media (prefers-reduced-motion: reduce){.g-tile{transition:none}.bump,.g-slots.no{animation:none}.g-card{transition:none}}
</style>

<header class="top" data-section="games">
  <div class="top-in">
    <div class="brand">
      <svg class="mark" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
        <rect width="256" height="256" rx="56" fill="var(--accent)"/>
        <g fill="none" stroke="var(--surface)" stroke-width="11" stroke-linecap="round">
          <path d="M62 156 A33 64 0 0 1 128 156"/>
          <path d="M128 156 A33 38 0 0 1 194 156"/>
        </g>
        <circle cx="62" cy="156" r="14" fill="var(--surface)"/>
        <circle cx="128" cy="156" r="14" fill="var(--surface)"/>
        <circle cx="194" cy="156" r="14" fill="var(--gold)"/>
      </svg>
      <h1>Oʻyinlar</h1>
      <span class="sub" id="brandStat"></span>
      <nav class="switch" id="secNav" aria-label="Asosiy menyu"></nav>
    </div>
    <div style="height:12px"></div>
  </div>
</header>
<script src="ui.js"></script>
<script src="verbs-data.js"></script>
<script src="a1-data.js"></script>
<script src="a2-data.js"></script>

<div class="wrap">

<section id="v-hub">
  <div class="stack">
    <div class="card g-lvl">
      <div class="g-badge" id="lvlN">1<small>daraja</small></div>
      <div class="t">
        <b id="lvlName">Yangi boshlovchi</b>
        <span id="lvlTxt">0 XP</span>
        <div class="g-xp"><i id="lvlBar" style="width:0%"></i></div>
      </div>
      <div class="g-tools">
        <button class="g-tog" type="button" id="sndBtn" aria-pressed="true">🔊 Ovoz</button>
        <button class="g-tog" type="button" id="sayBtn" aria-pressed="true">🗣 Talaffuz</button>
      </div>
    </div>
    <fieldset>
      <legend>Qaysi soʻzlar bilan oʻynaymiz?</legend>
      <div class="g-src opts" id="srcBox"></div>
    </fieldset>
    <div class="g-list" id="gameList"></div>
  </div>
</section>

<section id="v-quiz" hidden>
  <div class="g-top">
    <h2 id="gTitle"></h2>
    <span class="g-num" id="gInfo"></span>
    <span class="g-num" id="gScore">0<small>ball</small></span>
    <button class="g-x" type="button" id="gQuit" aria-label="Oʻyinni toʻxtatish" title="Toʻxtatish (Esc)">✕</button>
  </div>
  <div class="g-meter" id="gMeter"><i id="gMeterI" style="width:100%"></i></div>
  <div class="card g-stage" id="stage"></div>
</section>

<section id="v-end" hidden>
  <div class="card g-end" id="endBox"></div>
</section>

</div>

<script>
(function () {
var KEY = "games.v1";
var GAMES = [
  { id: "speed", cls: "g1", em: "⚡", title: "60 soniya", desc: "Toʻgʻri tarjimani tez tanlang. Ketma-ket topsangiz — ball ikki, uch barobar!" },
  { id: "match", cls: "g2", em: "🃏", title: "Juftlar", desc: "Kartochkalarni ochib, inglizcha soʻzni tarjimasi bilan juftlang. Xotirani charxlaydi." },
  { id: "anagram", cls: "g3", em: "🔤", title: "Harflar", desc: "Aralashib ketgan harflardan inglizcha soʻzni yigʻing. Imloni mustahkamlaydi." },
  { id: "guess", cls: "g4", em: "❤️", title: "Soʻzni top", desc: "Tarjimaga qarab soʻzni harfma-harf toping. 6 ta yurak — ehtiyot boʻling!" }
];
var SRCS = [
  { id: "mix", label: "Aralash" }, { id: "v", label: "Feʻllar" }, { id: "a1", label: "A1" }, { id: "a2", label: "A2" },
  { id: "my", label: "Mening soʻzlarim" }, { id: "mis", label: "Xatolarim" }
];
var LVLNAMES = ["Yangi boshlovchi", "Qiziquvchan", "Harakatchan", "Bilimdon", "Usta", "Chempion", "Ustoz", "Afsona"];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function p2(n) { return (n < 10 ? "0" : "") + n; }
function today() { var d = new Date(); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function read(key) { try { var o = JSON.parse(localStorage.getItem(key) || "null"); if (o && typeof o === "object") return o; } catch (e) {} return null; }

/* ---------- saqlash: rekordlar, XP, kunlik tarix (bosh sahifa va statistika uchun) ---------- */
var st = read(KEY) || {};
if (!st.best) st.best = {};
if (!st.cfg) st.cfg = {};
if (!st.xp) st.xp = 0;
if (SRCS.map(function (s) { return s.id; }).indexOf(st.cfg.src) < 0) st.cfg.src = "mix";
if (st.cfg.sound === undefined) st.cfg.sound = true;
if (st.cfg.say === undefined) st.cfg.say = true;
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function logDay(i) {
  if (!st.d) st.d = {};
  var k = today(), e = st.d[k] || (st.d[k] = [0, 0, 0]);
  e[i] = (e[i] || 0) + 1;
}

/* ---------- soʻzlar: feʻllar, A1, A2, mening soʻzlarim ---------- */
function norm(s) { return (s || "").toLowerCase().replace(/[ʻʼ‘’`´']/g, "'").replace(/\s+/g, " ").trim(); }
/* koʻrsatish uchun qisqa tarjima: birinchi maʼnosi */
function shortUz(s) {
  s = String(s).split(/\s*;\s*/)[0];
  if (s.length > 24) s = s.split(/\s*,\s*/)[0];
  if (s.length > 24) s = s.replace(/\s*\([^)]*\)/g, "");
  return s;
}
/* harf oʻyinlari uchun: faqat lotin harflaridan iborat 3–10 harfli soʻz */
function spell(en) { var b = norm(en).replace(/^to /, ""); return /^[a-z]{3,10}$/.test(b) ? b : ""; }
var WORDS = [], HAVE = {};
function add(src, en, uz, key, extra) {
  var k = norm(en) + "|" + norm(uz);
  if (HAVE[k]) return;
  HAVE[k] = 1;
  var it = { src: src, key: key, en: en, uz: shortUz(uz), uzFull: uz, sp: spell(en) };
  if (extra) for (var x in extra) it[x] = extra[x];
  WORDS.push(it);
}
VERBS_RAW.forEach(function (line) { var p = line.split("|"); add("v", p[0], p[3], p[0], { v1: p[0], v2: p[1], v3: p[2] }); });
A1_W.forEach(function (w) { add("a1", w[0], w[1], (w[0] + "|" + w[1]).toLowerCase()); });
A2_W.forEach(function (w) { add("a2", w[0], w[1], (w[0] + "|" + w[1]).toLowerCase()); });
var VERBS = WORDS.filter(function (w) { return w.v1; });
function myWords() {
  var my = read("my.v1");
  return my && Array.isArray(my.w) ? my.w : [];
}
var MYITEMS = [];
function loadMine() {
  MYITEMS = myWords().filter(function (m) { return m && m.en && m.uz; }).map(function (m) {
    var verb = /\s[–—-]\s/.test(m.en) ? m.en.split(/\s[–—-]\s/) : null;
    return { src: "my", key: "my:" + m.id, en: verb ? verb[0] : m.en, uz: shortUz(m.uz), uzFull: m.uz, sp: spell(verb ? verb[0] : m.en),
      v1: verb && verb[0], v2: verb && verb[1], v3: verb && verb[2] };
  });
}
loadMine();
/* «Xatolarim»: boshqa boʻlimlarda xato qilingan, hali yodlanmagan soʻzlar */
function mistakes() {
  var S = { v: read("irrverbs.v1"), a1: read("a1words.v1"), a2: read("a2words.v1") }, my = read("my.v1"), out = [];
  WORDS.forEach(function (it) {
    var s = S[it.src], p = s && s.p && s.p[it.key];
    if (p && (((p.bad | 0) > 0 && (p.lvl | 0) < 5) || p.mis)) out.push(it);
  });
  MYITEMS.forEach(function (it) {
    var r = my && my.r && my.r[it.key];
    if (r && (r.bad | 0) > 0 && (r.b | 0) < 5) out.push(it);
  });
  return out;
}
function pool(src) {
  if (src === "mis") return mistakes();
  if (src === "my") return MYITEMS.slice();
  if (src === "mix") return WORDS.slice();
  return WORDS.filter(function (it) { return it.src === src; });
}
/* oʻyin uchun kerakli eng kam soʻz soni */
function enough(game, list) {
  if (game === "anagram" || game === "guess") return list.filter(function (it) { return it.sp; }).length >= 3;
  if (game === "match") return list.length >= 4;
  return list.length >= 4;
}

/* ---------- ovoz va talaffuz ---------- */
var AC = null;
function beep(kind) {
  if (!st.cfg.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var notes = kind === "ok" ? [660, 880] : kind === "win" ? [523, 659, 784, 1047] : kind === "flip" ? [440] : [220, 180];
    notes.forEach(function (f, i) {
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * 0.09;
      o.type = kind === "bad" ? "square" : "triangle";

  }
  var played = g.ok + g.bad > 0 || g.score > 0;
  var lvl0 = lvlOf(st.xp), rec = !early && g.score > 0 && g.score > (st.best[g.id] || 0);
  if (played) { st.xp += g.score; if (rec) st.best[g.id] = g.score; st.plays = (st.plays || 0) + 1; save(); }
  var lvl1 = lvlOf(st.xp);
  var line = g.extra || (g.ok + " ta toʻgʻri" + (g.bad ? " · " + g.bad + " ta xato" : ""));
  var mine = {};
  myWords().forEach(function (m) { mine[norm(m.en) + "|" + norm(m.uz)] = 1; });
  var html = '<div style="font-size:2.6rem" aria-hidden="true">' + (rec ? "🏆" : g.score >= 100 ? "🎉" : meta.em) + "</div>" +
    "<h2 style=\"margin:4px 0 0\">" + (early ? "Oʻyin toʻxtatildi" : rec ? "Yangi rekord!" : "Oʻyin tugadi") + "</h2>" +
    '<p class="big">' + g.score + ' <small style="font-size:1rem;color:var(--muted)">ball</small></p>' +
    (stars ? '<div class="stars">' + stars + "</div>" : "") +
    '<p class="line">' + esc(line) + (played ? " · +" + g.score + " XP" : "") + "</p>" +
    (st.best[g.id] && !rec ? '<p class="line">🏆 Rekord: ' + st.best[g.id] + " ball</p>" : "") +
    (lvl1 > lvl0 ? '<span class="new">⭐ Yangi daraja: ' + lvl1 + " — " + LVLNAMES[Math.min(lvl1 - 1, LVLNAMES.length - 1)] + "</span>" : rec ? '<span class="new">🏆 Rekord yangilandi</span>' : "");
  if (g.miss.length) {
    html += '<ul class="g-miss" id="missList">' + g.miss.slice(0, 12).map(function (it, i) {
      var have = it.src === "my" || mine[norm(it.en) + "|" + norm(it.uzFull)];
      return "<li><span><b>" + esc(it.v1 ? it.v1 + " – " + it.v2 + " – " + it.v3 : it.en) + "</b> — " + esc(it.uzFull) + "</span>" +
        (have ? '<span class="hint" style="flex:0 0 auto">✓ Lugʻatimda</span>' : '<button class="btn ghost sm" type="button" data-addw="' + i + '">+ Lugʻatimga</button>') + "</li>";
    }).join("") + "</ul>";
  }
  html += '<div class="startbar" style="position:static;border:0;margin-top:18px"><button class="btn" type="button" id="again">↻ Yana oʻynash</button><button class="btn ghost" type="button" id="toHub">Boshqa oʻyin</button></div>';
  $("endBox").innerHTML = html;
  show("end");
  if (rec || lvl1 > lvl0) { beep("win"); if (window.confetti) confetti(); }
  $("again").onclick = function () { start(g.id); };
  $("toHub").onclick = function () { renderHub(); show("hub"); };
  var ml = $("missList");
  if (ml) ml.onclick = function (e) {
    var b = e.target.closest("[data-addw]");
    if (!b) return;
    var it = g.miss[+b.getAttribute("data-addw")];
    if (addToMine(it)) { b.outerHTML = '<span class="hint" style="flex:0 0 auto">✓ Qoʻshildi</span>'; }
  };
  $("again").focus();
}
/* xato qilingan soʻzni «Mening soʻzlarim»ga qoʻshish (my.html dagi tuzilishda) */
function addToMine(it) {
  var my = read("my.v1") || {};
  if (!Array.isArray(my.w)) my.w = [];
  var en = it.v1 ? it.v1 + " – " + it.v2 + " – " + it.v3 : it.en;
  if (my.w.some(function (m) { return norm(m.en) === norm(en) && norm(m.uz) === norm(it.uzFull); })) return true;
  my.w.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), en: en, uz: it.uzFull, note: "",
    ref: it.src === "my" ? "" : (it.src === "v" ? "v:" + it.key : it.src + ":" + it.key), from: it.src, t: today() });
  /* statistika sahifasi uchun tayyor hisobdagi soʻzlar soni — my.html ochilganda toʻliq qayta hisoblanadi */
  if (my.sum && my.sum.lv) { my.sum.n = my.w.length; my.sum.lv[0] = (my.sum.lv[0] | 0) + 1; }
  else my.sum = { n: my.w.length, lv: [my.w.length, 0, 0, 0, 0, 0], seen: 0, mis: 0, ok: 0, bad: 0, hard: [] };
  try { localStorage.setItem("my.v1", JSON.stringify(my)); return true; } catch (e) { return false; }
}

window.addEventListener("storage", function (e) { if (!G && !$("v-hub").hidden && (e.key === "my.v1" || /words|verbs/.test(e.key || ""))) renderHub(); });
renderHub();
/* bosh sahifadan toʻgʻridan-toʻgʻri oʻyinga: games.html#speed */
var h = location.hash.slice(1);
if (GAMES.some(function (g) { return g.id === h; })) { try { history.replaceState(null, "", location.pathname); } catch (e) {} start(h); }
})();
</script>
